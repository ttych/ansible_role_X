---

- block:
    - include_tasks: _context.yml

    - include_tasks: x11.yml

    - include_tasks: lxqt.yml

    - include_tasks: kde.yml

    - include_tasks: sddm.yml

  when:
    - want_x
    - (host_type == 'workstation') or (is_workstation|d(false)) or (is_desktop|d(false))


- name: set has_x
  ansible.builtin.set_fact:
    has_x: "{{ want_x and ((host_type == 'workstation') or (is_workstation|d(false)) or (is_desktop|d(false))) }}"
    has_x11: "{{ want_x and ((host_type == 'workstation') or (is_workstation|d(false)) or (is_desktop|d(false))) }}"
