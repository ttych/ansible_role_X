---

- name: lxqt
  when: x_desktop not in [none, ''] and x_desktop in ['lxde', 'lxqt']
  block:

    - name: install lxqt
      ansible.builtin.package:
        name: "{{x_lxqt_packages }}"
        state: present

    - name: lxqt sudoers
      ansible.builtin.template:
        src: lxqt/sudoers
        dest: "{{ x_lxqt_sudoers_d }}/{{ x_lxqt_sudoers_order }}_lxqt"
        owner: root
        group: 0
        mode: '0440'


    - name: set has_lxqt and has_lubuntu
      ansible.builtin.set_fact:
        has_lxqt: yes
        has_lubuntu: yes
